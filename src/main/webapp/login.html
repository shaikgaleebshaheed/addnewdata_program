<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
</head>
<body>

<h2>Add Student</h2>

<form action="add" method="post">

    <label>Name:</label>
    <input type="text" name="name" required>
    <br><br>

    <label>Age:</label>
    <input type="number" name="age" required>
    <br><br>

    <label>Course:</label>
    <input type="text" name="course" required>
    <br><br>

    <button type="submit">Add Student</button>

</form>

</body>
</html>
